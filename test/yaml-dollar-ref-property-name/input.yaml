openapi: 3.0.3
info:
  title: SCIM API
  version: 1.0.0
paths:
  /groups/{group_id}:
    get:
      operationId: get-scim-group
      summary: Get a SCIM Group resource
      parameters:
        - name: group_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/group_details"
components:
  schemas:
    group_details:
      type: object
      properties:
        displayName:
          type: string
          description: The display name of the SCIM Group resource.
        members:
          type: array
          description: The direct members of the SCIM Group resource.
          items:
            type: object
            required:
              - value
            properties:
              value:
                type: string
                description: The unique identifier of the member resource.
                example: bd97ef8d-7986-43e3-9ee0-c25dda33e4b0
              display:
                type: string
                description: The display name of the member resource.
                example: john.smith@example.com
              type:
                type: string
                description: The SCIM resource type of the member.
                enum:
                  - User
                  - Group
                example: User
              "$ref":
                type: string
                format: uri
                description: The URI of the member resource.
                example: https://example.com/scim/v2/Users/bd97ef8d-7986-43e3-9ee0-c25dda33e4b0
